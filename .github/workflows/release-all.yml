# [VERIFIED-GOLDEN: multi-os-release-pipeline | 2026-11-26 | DO NOT MODIFY UNLESS TARGETED]
name: Build & Release Duytai Cross-Platform (Windows + macOS + Android)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Xuất bản trực tiếp lên GitHub Releases (kèm SHA256SUMS & Extension ZIP)'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Tag phát hành tùy chọn khi chạy thủ công (vd: v7.6.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Universal (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Core Engine, Version Sync & Automated Test Suite on macOS
        run: |
          npm run check
          npm test
      - name: Build & Code-Sign Universal macOS App & DMG
        run: |
          chmod +x macos/build-macos-app.sh macos/Install-Duytai-macOS.sh macos/duytai-native-host.sh
          bash -n macos/build-macos-app.sh
          bash -n macos/Install-Duytai-macOS.sh
          bash -n macos/duytai-native-host.sh
          ./macos/build-macos-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Duytai-macOS-Universal
          path: Duytai-macOS-Universal.dmg

  build-android:
    name: Build, Sign & Test Android Release (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Ensure Release Keystore, Run Unit Tests & Assemble Signed Release APK
        working-directory: android
        run: |
          if [ ! -f app/duytai-release.jks ]; then
            keytool -genkeypair -v -keystore app/duytai-release.jks -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 10000 -alias duytai -storepass "DuytaiSign#2026" -keypass "DuytaiSign#2026" -dname "CN=DOANDUY Software (Duytai 64-Bit), OU=Mobile Engineering, O=DOANDUY Software, L=Ho Chi Minh, ST=HCM, C=VN"
          fi
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify -v --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Export Signed Release APK & Browser Extension ZIP
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Duytai-Android.apk
          (cd extension && zip -qr ../Duytai-Browser-Extension.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: Duytai-Android-APK
          path: |
            Duytai-Android.apk
            Duytai-Browser-Extension.zip

  build-windows:
    name: Build, Sign & Test Windows (.exe & Setup)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Automated Core Test Suite, Compile & Authenticode-Sign Windows Binaries
        shell: powershell
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { throw "Core syntax / version check failed" }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Core automated tests failed" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /platform:x64 /optimize+ /win32icon:assets\Duytai.ico /win32manifest:app.manifest /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Core.dll /r:System.Web.Extensions.dll /out:Duytai.exe HyperIDM.cs
          if ($LASTEXITCODE -ne 0) { throw "Failed to compile Duytai.exe" }
          Copy-Item Duytai.exe HyperIDM.exe -Force
          & .\Sign-Duytai.ps1 -TargetPaths @(".\Duytai.exe", ".\HyperIDM.exe")

          $stage = Join-Path $env:TEMP "duytai_stage_ci"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "$stage\public", "$stage\extension", "$stage\assets" -Force | Out-Null
          foreach ($f in @("package.json","engine.js","server.js","idm-features.js","clipboard-batch.js","cli.js","duytai-native-host.js","HyperIDM.cs","app.manifest","Sign-Duytai.ps1","Duytai-CodeSigning.cer","Install-HyperIDM.ps1","Install-HyperIDM.bat","Duytai.exe","HyperIDM.exe")) {
              if (Test-Path $f) { Copy-Item $f "$stage\$f" -Force }
          }
          Copy-Item "public\*" "$stage\public" -Recurse -Force
          Copy-Item "extension\*" "$stage\extension" -Recurse -Force
          Copy-Item "assets\*" "$stage\assets" -Recurse -Force
          $payloadZip = Join-Path $env:TEMP "duytai_payload.zip"
          Remove-Item $payloadZip -Force -ErrorAction SilentlyContinue
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage, $payloadZip)

          & $csc /nologo /target:winexe /platform:x64 /optimize+ /win32icon:assets\Duytai.ico /win32manifest:app.manifest /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll "/resource:$payloadZip,payload.zip" /out:Duytai-Setup.exe SetupBootstrap.cs
          if ($LASTEXITCODE -ne 0) { throw "Failed to compile Duytai-Setup.exe" }
          & .\Sign-Duytai.ps1 -TargetPaths @(".\Duytai-Setup.exe")
          Get-AuthenticodeSignature .\Duytai.exe, .\Duytai-Setup.exe | Format-Table Path, Status, StatusMessage -AutoSize
      - uses: actions/upload-artifact@v4
        with:
          name: Duytai-Windows
          path: |
            Duytai.exe
            Duytai-Setup.exe
            Duytai-CodeSigning.cer

  publish-release:
    needs: [build-macos, build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate SHA256SUMS & Publish Atomic Multi-OS GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          PKG_VER=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v${PKG_VER}"
          fi

          mkdir -p release_bundle
          cp \
            artifacts/Duytai-Windows/Duytai-Setup.exe \
            artifacts/Duytai-Windows/Duytai.exe \
            artifacts/Duytai-Windows/Duytai-CodeSigning.cer \
            artifacts/Duytai-macOS-Universal/Duytai-macOS-Universal.dmg \
            artifacts/Duytai-Android-APK/Duytai-Android.apk \
            artifacts/Duytai-Android-APK/Duytai-Browser-Extension.zip \
            release_bundle/

          (cd release_bundle && sha256sum * > SHA256SUMS.txt)
          cat release_bundle/SHA256SUMS.txt

          NOTES_FILE="release_notes.md"
          cat > "$NOTES_FILE" << EOF
          ## ⚡ Duytai ${TAG} — Cross-Platform 64/128-Thread Download Accelerator
          - **Windows 10/11 x64**: \`Duytai-Setup.exe\` (1-Click Signed Installer + Native Browser Host) & \`Duytai.exe\` (Standalone Signed Portable)
          - **macOS Universal (Apple Silicon M1–M4 + Intel)**: \`Duytai-macOS-Universal.dmg\` (Hardened Runtime + Core Bundle + Clipboard Batch + CLI)
          - **Android 8.0+ (SDK 35)**: \`Duytai-Android.apk\` (V1–V4 Signed Release APK)
          - **Browser Integration (Chrome / Edge / Cốc Cốc / Brave / Firefox)**: \`Duytai-Browser-Extension.zip\` (Manifest V3 v${PKG_VER})
          - **Engine Highlights**: Native HLS \`.m3u8\` 64-Thread Segment Engine, Zero-RTT Warm-Socket Reuse, 25ms Fast CDN Failover, Dynamic Work-Stealing, Zero-Rebuild In-Place Write, \`SHA256SUMS.txt\` Verified.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release_bundle/* --clobber
            gh release edit "$TAG" --title "Duytai ${TAG} — Cross-Platform Official Release (Windows + macOS + Android)" --notes-file "$NOTES_FILE" --draft=false
          else
            gh release create "$TAG" release_bundle/* --title "Duytai ${TAG} — Cross-Platform Official Release (Windows + macOS + Android)" --notes-file "$NOTES_FILE" --latest
          fi
# [/VERIFIED-GOLDEN]
